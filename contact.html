<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Eyestyle</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Eyestyle</a>

            <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"> <a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"> <a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"> <a class="nav-link" href="product.html">Products</a></li>
                    <li class="nav-item"> <a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="container contact-section">
        <h1 class="text-center mb-4">Contact Us</h1>
        <p class="text-center">Have Questions? Send us a message!</p>

        <div class="row justify-content-center">
            <div class="col-md-7">
                 
                <form action="sendMessage(event)">
                    <div class="mb-3">
                        <label for="name" class="form-label">Your name</label>
                        <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Your email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea id="message" class="form-control" placeholder="Write your message" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Send Message
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p>Email: your-email@example.com</p>
                    <p>Location: Add your shop address here</p>
                </div>
            </div>

        </div>
    </section>

    <footer>
        <p>&copy; 2026 Eyestyle Eyeglasses Shop</p>
    </footer>

    <script>
        function sendMessage(event) {
            event.preventDefault();
            alert("Thank you for contacting Eyestyle! This is a demo form.");
            event.target.reset();
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
</body>
</html>
